name: CI — Test, Build & Push to ECR

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Test ─────────────────────────────────────────────────────────────
  test:
    name: Test Go code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: |
            backend/go.sum
            lambda/go.sum

      # Backend
      - name: Download backend dependencies
        working-directory: backend
        run: go mod download

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Test backend
        working-directory: backend
        run: go test ./... -v -cover -count=1

      # Lambda
      - name: Download lambda dependencies
        working-directory: lambda
        run: go mod download

      - name: Vet lambda
        working-directory: lambda
        run: go vet ./...

  # ── Job 2: Build & Push to ECR ──────────────────────────────────────────────
  build-and-push:
    name: Build Docker image and push to ECR
    runs-on: ubuntu-latest
    needs: test
    # Only push on main branch pushes (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write   # Required for OIDC
      contents: read
      actions: write    # Required to trigger CD workflow

    outputs:
      ecr_url:   ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPO_NAME }}
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          ECR_URL="${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPO_NAME }}"
          echo "ecr_url=${ECR_URL}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${{ github.sha }}"   >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.ecr_url }}:${{ steps.meta.outputs.sha_tag }} \
            -t ${{ steps.meta.outputs.ecr_url }}:latest \
            ./backend

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.meta.outputs.ecr_url }}:${{ steps.meta.outputs.sha_tag }}
          docker push ${{ steps.meta.outputs.ecr_url }}:latest

      - name: Trigger CD workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner:   context.repo.owner,
              repo:    context.repo.repo,
              workflow_id: 'cd.yml',
              ref:     'main',
              inputs: {
                image_tag: '${{ steps.meta.outputs.sha_tag }}'
              }
            });
